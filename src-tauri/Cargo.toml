[package]
name = "novel-studio"
version = "0.1.0"
description = "墨隐 · AI 小说创作工作台"
authors = ["Novel Studio"]
edition = "2021"

[lib]
name = "novel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend instead of pointing at the dev server.
# `tauri build` enables this automatically.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
base64 = "0.22"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"
encoding_rs = "0.8"
raw-window-handle = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
